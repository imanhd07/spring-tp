<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Modifier Produit</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<h1>Modifier Produit</h1>

<form th:action="@{/products/update}" th:object="${product}" method="post">
  <input type="hidden" th:field="*{id}">

  <input th:field="*{name}" placeholder="Nom du produit" required>
  <input th:field="*{description}" placeholder="Description">
  <input th:field="*{price}" type="number" step="0.01" placeholder="Prix" required>

  <button type="submit">Enregistrer</button>
  <a class="btn-back" href="/">Retour</a>
</form>

</body>
</html>
