<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Articles</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f5f5f5; }
        h1 { color: #2c3e50; }
        .article { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #3498db; }
        input, textarea { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; width: 300px; }
        button { padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Produits</a>
        <a href="/articles">Articles</a>
    </div>

    <h1>Blog - Articles</h1>

    <div th:each="article : ${articles}">
        <div class="article">
            <h3 th:text="${article.title}"></h3>
            <p th:text="${article.content}"></p>
        </div>
    </div>

    <h2>Ajouter un Article</h2>
    <form th:action="@{/articles/add}" th:object="${newArticle}" method="post">
        <input th:field="*{title}" placeholder="Titre de l'article" required/><br/>
        <textarea th:field="*{content}" placeholder="Contenu..." rows="4"></textarea><br/>
        <button type="submit">Publier</button>
    </form>
</body>
</html>
