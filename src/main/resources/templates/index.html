<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring TP</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f5f5f5; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #3498db; color: white; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Produits</a>
        <a href="/articles">Articles</a>
    </div>

    <h1>Catalogue Produits</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Prix</th>
            <th>Description</th>
        </tr>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.price} + ' MRU'"></td>
            <td th:text="${product.description}"></td>
        </tr>
    </table>

    <h2>Ajouter un Produit</h2>
    <form th:action="@{/products/add}" th:object="${newProduct}" method="post">
        <input th:field="*{name}" placeholder="Nom du produit" required/>
        <input th:field="*{price}" placeholder="Prix" type="number" step="0.01" required/>
        <input th:field="*{description}" placeholder="Description"/>
        <button type="submit">Ajouter</button>
    </form>
</body>
</html>
